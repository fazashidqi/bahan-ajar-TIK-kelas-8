<!DOCTYPE html>
<html>
<head>
    <title>Belajar Box CSS</title>
    <style>
        /* Ini adalah bagian CSS untuk menghias kotak */
        .kotak-profil {
            background-color: rgb(6, 208, 248); /* Warna latar */
            width: 500px;               /* Lebar kotak */
            padding: 20px;              /* Jarak di dalam kotak */
            border: 5px solid rgb(16, 3, 3);     /* Garis pinggir */
            border-radius: 15px;        /* Membuat sudut melengkung */
            text-align: center;         /* Teks di tengah */
            margin: 50px auto;          /* Kotak berada di tengah halaman */
            font-family: sans-serif;
        }

        .foto-dummy {
            object-fit: cover;   
            background-color: white;
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            border-radius: 50%;         /* Membuat lingkaran */
            line-height: 100px;         /* Agar teks di tengah lingkaran */
        }

        .gambar-landscape{
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>

    <div class="kotak-profil">
        <div class="foto-dummy">
            <img src="thumb watubolong.jpg" class="foto-dummy">
        </div>
        <h1>Petarunx Arsenal kalah yuhuu</h1>
        <p>Saya fans Barca tapi mendukung Real Betis karena ada Lord Antony</p>
        <button>Kenali Saya</button>
    </div>    

</body>
</html>
